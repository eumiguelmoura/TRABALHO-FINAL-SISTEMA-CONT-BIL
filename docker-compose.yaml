services:
  php:
    build:
      context: ./docker/php
    working_dir: /var/www
    volumes:
      - ./apps/api:/var/www
    depends_on:
      mysql:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    ports:
      - '8182:80'
    volumes:
      - ./apps/api:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sistema_contabil
      MYSQL_USER: contabil
      MYSQL_PASSWORD: contabil_local_somente
      MYSQL_ROOT_PASSWORD: root_local_somente
    ports:
      - '33106:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      retries: 10
      timeout: 5s
  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - '8184:80'
    depends_on:
      mysql:
        condition: service_healthy
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c 'npm install --no-audit --no-fund && npx quasar dev --hostname 0.0.0.0 --port 9010'
    ports:
      - '9010:9010'
volumes:
  mysql_data:
  web_node_modules:
